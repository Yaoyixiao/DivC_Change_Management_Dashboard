html,body{margin:0}
body{
  background:var(--canvas); color:var(--body);
  font:14px/1.5 Inter,-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh}
/* pill rail: a floating icon capsule vertically centered on the left edge.
   A gradient indicator slides behind the active view; labels live in hover
   tooltips, so there is no brand row and no expanded state at all. */
.rail{
  position:fixed; z-index:40; left:24px; top:var(--rail-center); transform:translateY(-50%);
  width:68px; align-items:flex-start;
  display:flex; flex-direction:column; padding:8px; border-radius:999px;
  background:rgba(255,255,255,.75); border:1px solid rgba(2,5,32,.1);
  -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 26px 60px -26px rgba(2,5,32,.28);
}
.rail-ind{
  position:absolute; left:8px; right:8px; top:8px; height:52px; border-radius:16px;
  background:linear-gradient(140deg, var(--accent), #8ab4f8);
  box-shadow:0 8px 20px -8px rgba(59,130,246,.6);
  transition:transform .5s cubic-bezier(.34,1.3,.5,1);
}
/* the first flex row is the search slot, so nav items start one row down */
.rail:has(.rail-item:nth-of-type(1).is-active) .rail-ind{ transform:translateY(52px); }
.rail:has(.rail-item:nth-of-type(2).is-active) .rail-ind{ transform:translateY(104px); }
.rail-item{
  position:relative; z-index:1; width:52px; height:52px;
  display:grid; place-items:center; color:var(--mut); transition:color .25s ease;
}
.rail-item svg{ width:21px; height:21px; display:block; }
.rail-item:hover{ color:var(--ink); }
.rail-item.is-active{ color:#fff; }
.rail-item[aria-disabled="true"]{ color:var(--faint); cursor:default; }
.rail-item[aria-disabled="true"]:hover{ color:var(--faint); }
/* hover tooltip floating right of the pill */
.tip{
  position:absolute; left:calc(100% + 14px); top:50%;
  transform:translateY(-50%) translateX(-4px);
  padding:5px 10px; border-radius:8px; background:var(--card);
  border:1px solid var(--line); box-shadow:var(--shadow);
  color:var(--ink); font-size:12.5px; font-weight:500; white-space:nowrap;
  opacity:0; pointer-events:none;
  transition:opacity .18s ease, transform .18s cubic-bezier(.34,1.3,.5,1);
}
.tip::after{
  content:""; position:absolute; left:-4.5px; top:50%; width:8px; height:8px;
  transform:translateY(-50%) rotate(45deg); background:var(--card);
  border-left:1px solid var(--line); border-bottom:1px solid var(--line);
}
.rail-item:hover .tip, .rail-item:focus-visible .tip{
  opacity:1; transform:translateY(-50%) translateX(0);
}
/* expanding search lives in the rail's first slot. At rest it is transparent
   and reads as a plain rail icon; focused or holding a query it grows into a
   glass pill that overflows the capsule rightward (accent ring while active) */
.exs{
  position:relative; z-index:1;
  display:flex; align-items:center; height:52px; width:52px; border-radius:999px;
  background:transparent; border:1px solid transparent;
  transition:width .48s cubic-bezier(.22,.61,.36,1), box-shadow .3s, background-color .3s;
}
.exs:focus-within,
.exs:has(.exs-input:not(:placeholder-shown)){
  width:min(680px, calc(100vw - 156px));
  background:rgba(255,255,255,.95);
  box-shadow:0 0 0 2px var(--accent), 0 26px 60px -26px rgba(2,5,32,.28);
}
.exs-ico{
  flex:0 0 52px; height:52px; display:grid; place-items:center;
  color:var(--mut); cursor:text; transition:color .2s;
}
.exs:hover .exs-ico{ color:var(--ink); }
.exs:focus-within .exs-ico{ color:var(--accent); }
.exs-ico svg{ width:18px; height:18px; }
.exs-input{
  flex:1; min-width:0; height:100%; background:transparent; border:0; outline:none;
  color:var(--ink); font:inherit; padding:0 6px;
}
.exs-input::placeholder{ color:var(--faint); }
.exs-input::-webkit-search-cancel-button{ display:none; }
.exs-clear{
  flex:0 0 auto; width:30px; height:30px; margin-right:9px; border:0; border-radius:50%;
  background:var(--fog); color:var(--mut); cursor:pointer; font-size:12px; line-height:1;
  opacity:0; transform:scale(.7); pointer-events:none; transition:opacity .2s, transform .2s;
}
.exs-input:not(:placeholder-shown) ~ .exs-clear{ opacity:1; transform:scale(1); pointer-events:auto; }
.exs-clear:hover{ background:#dbeafe; color:var(--accent); }
/* collapsed-only tooltip: the input itself is the label once expanded */
.exs:hover .tip{ opacity:1; transform:translateY(-50%) translateX(0); }
.exs:focus-within .tip,
.exs:has(.exs-input:not(:placeholder-shown)) .tip{ opacity:0; }

/* content clears the floating rail column (24 + 68 + 16 gap) */
.main{flex:1; min-width:0; padding:28px 32px 56px 108px}
.content{max-width:1680px; margin:0 auto}

/* global search results: preview-only dropdown beneath the expanding pill,
   which sits in the rail's first slot (slot top at var(--rail-center) - 78px,
   so the panel starts 8px below the 52px pill). Selection navigates, never
   re-scopes; no JS positioning needed. */
.search-panel{
  position:fixed; left:32px; top:calc(var(--rail-center) - 18px); z-index:60;
  width:min(560px, calc(100vw - 156px)); max-height:min(480px, calc(50vh - 30px)); overflow:auto;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 12px 32px -12px rgba(2,5,32,.18); padding:6px;
  opacity:0; transform:translateY(-4px);
  transition:opacity .16s ease, transform .16s ease;
}
.search-panel.open{opacity:1; transform:none}
.search-panel[hidden]{display:none}
.search-ghead{
  display:flex; justify-content:space-between; align-items:baseline; padding:8px 10px 4px;
  font:600 10px/1 Inter,system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
}
.search-ghead .cnt{color:var(--accent); letter-spacing:0; font-size:10.5px; font-variant-numeric:tabular-nums}
.search-row{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px;
  font-size:13px; cursor:pointer;
}
.search-row.active{background:var(--accent-soft)}
.search-row .s-id{flex:none; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.search-row .s-sum{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--sec)}
.search-row .s-meta{flex:none; font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}
.search-row mark{background:#dbeafe; color:inherit; border-radius:2px; padding:0 1px}
.search-empty{padding:24px 12px; text-align:center; font-size:12.5px; color:var(--faint)}
.search-foot{
  display:flex; gap:12px; padding:8px 10px 4px; border-top:1px solid var(--line-soft); margin-top:4px;
  font-size:10.5px; color:var(--faint);
}
/* locate flash: brief accent wash fading out */
@keyframes flashfade{0%{background-color:#bfdbfe} 60%{background-color:#dbeafe} 100%{background-color:transparent}}
tr.row.flash{animation:flashfade 1.2s ease-out}

/* ---------- cards ---------- */
.bento{display:grid; grid-template-columns:repeat(12,1fr); gap:14px; margin-top:14px}
/* scope cue: shown while search/status filters narrow the ECR set driving the cards */
.bento-scope{
  display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--mut);
}
.bento-scope[hidden]{display:none}
.bento-scope .scope-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none}
.bento-scope b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.bento-scope button{
  margin-left:6px; font-size:11.5px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); padding:3px 10px; border-radius:var(--r-pill);
}
.bento-scope button:hover{background:#dbeafe}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
  box-shadow:var(--shadow); padding:20px 24px; min-width:0;
}
.span4{grid-column:span 4}.span3{grid-column:span 3}.span5{grid-column:span 5}
.span7{grid-column:span 7}
.card-label{
  display:flex; align-items:baseline; gap:8px; margin-bottom:14px;
  font:600 11px/1 Inter,system-ui,sans-serif; letter-spacing:.08em;
  text-transform:uppercase; color:var(--mut);
}
.card-label .num{font-size:11px; letter-spacing:0; color:var(--accent); font-weight:700}

/* state dots (shared with table detail rows) */
.dot{width:7px; height:7px; border-radius:50%; flex:none}
.dot.open{background:var(--open)} .dot.closed{background:var(--closed)}

/* totals KPI */
#card-totals{display:flex; flex-direction:column}
.kpi-row{display:flex; flex:1; align-items:flex-end; margin-top:auto}
.kpi{flex:1; min-width:0}
.kpi + .kpi{border-left:1px solid var(--line-soft); padding-left:16px; margin-left:16px}
.kpi .k{
  font:600 11px/1 Inter,system-ui,sans-serif; letter-spacing:.08em;
  text-transform:uppercase; color:var(--mut); margin-bottom:10px;
}
.kpi .v{
  font-size:32px; font-weight:700; letter-spacing:-.02em; color:var(--ink);
  font-variant-numeric:tabular-nums; line-height:1;
}

/* effort: planned vs actual comparison (reuses .kpi anatomy) */
#card-effort{display:flex; flex-direction:column}
.card-foot{margin-top:12px; font-size:11.5px; color:var(--faint)}

/* creation timeline (horizontal) — no card title, rail centered for breathing room */
#card-timeline{display:flex; flex-direction:column; justify-content:center}
.tl{display:flex; height:128px; margin:0; position:relative}
.tl li{flex:1; position:relative; min-width:0; list-style:none}
.tl li:not(:last-child)::after{
  content:""; position:absolute; top:50%; left:calc(50% + 9px);
  width:calc(100% - 18px); height:2px; background:var(--line); transform:translateY(-50%);
}
.tl-dot{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:11px; height:11px; border-radius:50%; background:var(--accent); z-index:1;
}
.tl-dot.pending{background:#fff; border:2.5px solid var(--open)}
.tl-dot.pending::after{
  content:""; position:absolute; inset:-2.5px; border-radius:50%;
  border:2px solid var(--open); opacity:.55; animation:pulse 2s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(1); opacity:.55} 70%{transform:scale(2.1); opacity:0} 100%{opacity:0}}
.tl-tag{
  position:absolute; left:50%; transform:translateX(-50%); text-align:center; white-space:nowrap;
}
.tl li:nth-child(odd) .tl-tag{bottom:calc(50% + 14px)}
.tl li:nth-child(even) .tl-tag{top:calc(50% + 14px)}
.tl-tag .tl-id{display:block; font-size:12px; font-weight:600; color:var(--body); font-variant-numeric:tabular-nums}
.tl-tag time{display:block; font-size:9.5px; color:var(--faint); margin-top:2px; font-variant-numeric:tabular-nums}
.tl-empty{flex:1; display:grid; place-items:center; font-size:12.5px; color:var(--faint)}
@media (prefers-reduced-motion:reduce){
  .tl-dot.pending::after{animation:none}
  tr.row.flash{animation:none; background:#dbeafe}
  .rail-ind, .tip, .exs, .exs-clear{transition:none}
}

/* process area columns (vertical, reference-style) */
.pa-list{overflow-x:auto; margin-top:2px}
.pa-chart{display:flex; align-items:stretch; gap:8px; min-width:660px; height:216px}
.pa-col{flex:1 1 0; min-width:42px; display:flex; flex-direction:column}
.pa-slot{flex:1; position:relative}
.pa-fill{position:absolute; left:0; right:0; bottom:0; background:var(--accent); border-radius:6px 6px 0 0}
.pa-col.other .pa-fill{background:#cbd5e1}
.pa-val{
  position:absolute; left:50%; transform:translateX(-50%); z-index:1;
  font-size:10.5px; font-weight:600; color:var(--mut); font-variant-numeric:tabular-nums; line-height:1;
}
.pa-val.in{color:#fff}
.pa-name{
  height:28px; margin-top:8px; text-align:center; overflow:hidden;
  font:600 10px/1.2 Inter,system-ui,sans-serif; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mut);
}
.pa-empty{padding:48px 0; text-align:center; font-size:12.5px; color:var(--faint)}

/* team donut */
#card-team{display:flex; flex-direction:column}
.team-wrap{display:flex; align-items:center; gap:24px; flex:1}
.donut{
  width:136px; height:136px; border-radius:50%; flex:none; position:relative;
  background:conic-gradient(var(--seg, var(--accent)) var(--from,0%) var(--to,0%), transparent 0);
}
.donut::before{content:""; position:absolute; inset:18px; border-radius:50%; background:var(--card)}
.donut b{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:19px; font-weight:600; letter-spacing:-.02em; color:var(--ink); font-variant-numeric:tabular-nums;
}
.legend{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; min-width:0; flex:1}
.legend li{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--sec)}
.legend .ldot{width:8px; height:8px; border-radius:50%; flex:none}
.legend .lname{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.legend .lval{margin-left:auto; color:var(--mut); font-variant-numeric:tabular-nums; flex:none}

/* ---------- table card ---------- */
.table-card{margin-top:12px; padding:0; overflow:visible; position:relative}
.t-head{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:14px 18px; border-bottom:1px solid var(--line);
}
.t-title{font-size:15px; font-weight:600; color:var(--ink)}
.t-title .t-num{color:var(--accent); font-weight:700; font-size:13px; margin-left:4px; font-variant-numeric:tabular-nums}
.t-controls{margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.seg{display:flex; background:var(--fog); border-radius:var(--r-pill); padding:3px}
.seg button{font-size:12.5px; font-weight:500; color:var(--sec); padding:5px 13px; border-radius:var(--r-pill)}
.seg button:hover{color:var(--ink)}
.seg button.is-on{background:var(--accent); color:#fff; font-weight:600}
.t-search{
  display:flex; align-items:center; gap:8px; height:32px; padding:0 10px;
  border:1px solid var(--line); border-radius:var(--r-el); background:var(--wash); color:var(--mut); width:190px;
}
.t-search svg{width:14px; height:14px; flex:none}
.t-search input{flex:1; min-width:0; border:0; background:none; font:inherit; font-size:13px; color:var(--ink); outline:none}
.t-search input::placeholder{color:var(--faint)}
/* clear-all table filters: appears only while any filter (seg/text/column) is active */
.t-clear{
  height:32px; padding:0 12px; border-radius:var(--r-el);
  background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600;
}
.t-clear:hover{background:#dbeafe}
.t-clear[hidden]{display:none}
.t-cols{position:relative}
.t-cols-btn{
  display:flex; align-items:center; gap:6px; height:32px; padding:0 12px;
  border:1px solid var(--line); border-radius:var(--r-el); background:var(--card);
  font-size:13px; font-weight:500; color:var(--sec);
}
.t-cols-btn:hover{background:var(--wash)}
.t-cols-btn svg{width:13px; height:13px}
.t-cols-pop{
  display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:20; width:210px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
  padding:6px; max-height:min(430px, 70vh); overflow:auto;
}
.t-cols-pop.is-open{display:block}
.t-cols-pop label{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  font-size:13px; color:var(--body); cursor:pointer;
}
.t-cols-pop label:hover{background:var(--wash)}
.t-cols-pop input{accent-color:var(--accent); margin:0}

/* per-column filter trigger (Excel-style): faint funnel at rest so the
   affordance stays discoverable (and in the a11y tree), stronger on hover,
   pinned in accent while that column's filter is active */
.col-fbtn{
  display:inline-flex; align-items:center; justify-content:center;
  width:17px; height:17px; margin-left:6px; border-radius:5px;
  vertical-align:middle; color:#b6bdcc;
  opacity:.5; transition:opacity .12s ease, color .12s ease, background-color .12s ease;
}
.t-tbl th:hover .col-fbtn, .col-fbtn:focus-visible, .col-fbtn.is-active{opacity:1}
.col-fbtn:hover{background:var(--fog); color:var(--sec)}
.col-fbtn.is-active{color:var(--accent); background:var(--accent-soft)}
.col-fbtn svg{width:11px; height:11px}

/* column filter dropdown: one singleton panel re-anchored to the trigger,
   living on .table-card so .t-scroll never clips it */
.col-pop{
  position:absolute; z-index:30; width:264px;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 12px 32px -12px rgba(2,5,32,.18); padding:6px;
}
.col-pop[hidden]{display:none}
.col-pop-search{
  display:flex; align-items:center; gap:8px; height:30px; margin-bottom:4px; padding:0 9px;
  border:1px solid var(--line); border-radius:8px; background:var(--wash); color:var(--mut);
}
.col-pop-search:focus-within{border-color:var(--accent)}
.col-pop-search svg{width:13px; height:13px; flex:none}
.col-pop-search input{flex:1; min-width:0; border:0; background:none; font:inherit; font-size:12.5px; color:var(--ink); outline:none}
.col-pop-search input::placeholder{color:var(--faint)}
.col-pop input{accent-color:var(--accent); margin:0}
.col-pop-item{
  display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:7px;
  font-size:13px; color:var(--body); cursor:pointer;
}
.col-pop-item:hover{background:var(--wash)}
.col-pop-all{font-weight:600; color:var(--ink); border-bottom:1px solid var(--line-soft); border-radius:7px 7px 0 0}
.col-pop .v{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.col-pop .v.blank{color:var(--faint); font-style:italic}
.col-pop .n{flex:none; font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}
.col-pop-list{max-height:264px; overflow:auto; margin-top:2px}
.col-pop-none{padding:18px 8px; text-align:center; font-size:12.5px; color:var(--faint)}
.col-pop-foot{
  display:flex; justify-content:flex-end; align-items:center; gap:8px;
  border-top:1px solid var(--line-soft); margin-top:4px; padding:6px 4px 2px;
}
.col-pop-foot button{
  font-size:12px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); padding:4px 12px; border-radius:var(--r-pill);
}
.col-pop-foot button:hover{background:#dbeafe}
.col-pop-foot button[disabled]{color:var(--faint); background:var(--fog); cursor:default}

/* empty state: zero rows after any filter combination */
.t-tbl .t-empty td{padding:36px 16px; text-align:center; color:var(--faint); font-size:13px}

/* fixed 18px canvas gutters: the scroll viewport is inset from the card so
   clipped columns never touch the card edge, at any scroll position */
.t-scroll{overflow-x:auto; margin:0 18px}
.t-tbl{width:100%; border-collapse:collapse; min-width:780px}
.t-tbl th{
  text-align:left; font:600 11px/1.2 Inter,system-ui,sans-serif; letter-spacing:.06em;
  text-transform:uppercase; color:var(--mut); padding:11px 16px;
  border-bottom:1px solid var(--line); white-space:nowrap; user-select:none;
}
.t-tbl th.sortable{cursor:pointer}
.t-tbl th.sortable:hover{color:var(--ink)}
.t-tbl th[aria-sort]::after{content:" ↑"; color:var(--accent); vertical-align:middle}
.t-tbl th[aria-sort="descending"]::after{content:" ↓"}
.t-tbl th.r, .t-tbl td.r{text-align:right}
/* right edge rail: sized to visually match the quiet zone before the ID on
   the left (chevron rail + cell padding + width distribution, ~84px), applied
   to the last VISIBLE column so it travels with column toggles and horizontal
   scrolling */
.t-tbl th.edge, .t-tbl td.edge{padding-right:84px}
.t-tbl td{padding:12px 16px; border-bottom:1px solid var(--line-soft); white-space:nowrap; font-size:13.5px}
.t-tbl tbody tr:last-child td{border-bottom:0}
.t-tbl tbody tr.row:hover{background:var(--wash)}
.t-id{color:var(--body); font-weight:500; font-variant-numeric:tabular-nums; cursor:pointer}
.t-id:hover{text-decoration:underline}
/* entity-type round badge (Reference/Table_CSS.txt .tx-avatar): solid circle,
   dark tag — colors from the reference token palette, height matched to the
   STATE badge (24px). Green CR / yellow Task / blue WP / orange Action. */
.type-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; margin-right:7px; border-radius:50%;
  font:600 9px/1 Inter,system-ui,sans-serif; letter-spacing:.02em;
  color:#0a0b10; vertical-align:middle; flex:none;
}
.type-badge.t-cr{background:#46d6a0}
.type-badge.t-tk{background:#ffc24a}
.type-badge.t-wp{background:#6d8cff}
.type-badge.t-ac{background:#ff8f6d}
.type-badge.t-bd{background:#7c6cf6}
.t-sum{display:inline-block; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--body); vertical-align:bottom}
.t-muted{color:var(--mut); font-variant-numeric:tabular-nums}
.t-num{font-weight:600; font-variant-numeric:tabular-nums; color:var(--body)}
.chip{
  display:inline-block; padding:2px 9px; border-radius:var(--r-pill);
  background:var(--fog); color:var(--sec); font-size:11.5px; font-weight:600;
  font-variant-numeric:tabular-nums; margin-right:5px;
}
.badge{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
  padding:3px 10px; border-radius:var(--r-pill);
}
.badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.badge.open{color:var(--open-ink); background:var(--open-bg)}
.badge.closed{color:var(--closed-ink); background:var(--closed-bg)}
.badge.late{color:#b4232f; background:rgba(242,96,82,.13)}
.chev{
  width:22px; height:22px; border-radius:6px; display:grid; place-items:center;
  color:var(--faint); transition:transform .16s ease;
}
.chev svg{width:13px; height:13px}
tr.row.is-open .chev{transform:rotate(90deg); color:var(--accent)}
tr.row.expandable{cursor:pointer}
/* row detail affordance (last column): opens the drawer; state-mirrors .chev */
.row-detail{
  width:22px; height:22px; border-radius:6px; display:grid; place-items:center;
  color:var(--faint); transition:color .16s ease, background-color .16s ease;
}
.row-detail svg{width:13px; height:13px; display:block}
tr.row:hover .row-detail{color:var(--sec)}
.row-detail:hover, tr.row.detail-open .row-detail{color:var(--accent); background:var(--accent-soft)}
.t-tbl th[data-col="detail"]{padding:11px 16px 11px 4px}
.t-tbl td[data-col="detail"]{padding:12px 16px 12px 4px}

/* inline child rows: one shared column set for ECRs, work items and actions.
   Hierarchy reads through tree guide lines in the ID column, mirroring
   Reference/Table_structure_UI_CSS.txt: one vertical line per ancestor level
   plus an 11px elbow into the row (11px gap · 1px line · 11px gap → 23px
   pitch per level). Filter hits get an ephemeral accent wash while active. */
.t-tbl td[data-col="id"]{position:relative}
.t-guides{position:absolute; top:0; bottom:0; left:0; pointer-events:none}
.t-guides i{position:absolute; box-sizing:border-box}
.t-guides i.vline{top:0; bottom:0; width:1px; background:#e4e4e7}
/* elbow: quarter-circle arc from the level's vertical line into the row;
   .end terminates the line at the elbow (last child of a sibling group) */
.t-guides i.elbow{top:calc(50% - 8px); height:8px; width:12px;
  border-left:1px solid #e4e4e7; border-bottom:1px solid #e4e4e7; border-bottom-left-radius:8px}
.t-guides i.elbow.end{top:0; height:50%}
.t-tbl tbody tr.row.hit{background:#e9f1ff}
.t-tbl tbody tr.row.hit:hover{background:#dfe9fc}

.t-foot{
  display:flex; align-items:center; padding:12px 18px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--mut); gap:22px;
}
.t-foot b{color:var(--body); font-weight:600; font-variant-numeric:tabular-nums}
.t-foot .right{margin-left:auto; display:flex; gap:22px}

/* ---------- detail drawer ----------
   Docked inspection sheet: the table truncates and scans, the drawer shows
   the full record (the summary wraps here by design). Every token is the
   house system's — the scrim uses the shadow ink, the slide reuses the
   expanding search's curve. Width drags from the left edge handle. */
.drawer-scrim{
  position:fixed; inset:0; z-index:70; background:rgba(2,5,32,.32);
  opacity:0; transition:opacity .2s ease;
}
.drawer-scrim.open{opacity:1}
.drawer-scrim[hidden]{display:none}
.drawer{
  position:fixed; z-index:71; top:0; right:0; bottom:0;
  width:440px; max-width:92vw; /* inline style carries the dragged width */
  display:flex; flex-direction:column;
  background:var(--card); border-left:1px solid var(--line);
  border-radius:var(--r-card) 0 0 var(--r-card);
  box-shadow:-24px 0 60px -24px rgba(2,5,32,.25);
  opacity:0; transform:translateX(24px);
  transition:opacity .28s cubic-bezier(.22,.61,.36,1), transform .28s cubic-bezier(.22,.61,.36,1);
}
.drawer.open{opacity:1; transform:none}
.drawer[hidden]{display:none}
body.drawer-open{overflow:hidden}
body.drawer-resizing{cursor:col-resize; user-select:none}

/* drag handle: 8px hit zone straddling the left edge, 4px grip line that
   lights up on hover/drag — the drawer's only decorative gesture */
.drawer-handle{
  position:absolute; left:-4px; top:0; bottom:0; width:8px; cursor:col-resize;
  display:flex; align-items:center; justify-content:center; touch-action:none; padding:0;
}
.drawer-handle::before{
  content:""; width:4px; height:56px; border-radius:2px; background:var(--line);
  transition:background-color .2s ease;
}
.drawer-handle:hover::before, .drawer-handle.dragging::before{background:var(--accent)}

.drawer-head{position:relative; flex:none; padding:24px 56px 20px 28px; border-bottom:1px solid var(--line-soft)}
.drawer-close{
  position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%;
  background:var(--fog); color:var(--mut); font-size:12px; line-height:1;
  display:grid; place-items:center; transition:background-color .2s, color .2s;
}
.drawer-close:hover{background:#dbeafe; color:var(--accent)}
.drawer-idrow{display:flex; align-items:center; gap:8px; min-width:0}
.drawer-idrow .type-badge{margin-right:0}
.drawer-ent-id{font-weight:600; font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums}
.drawer-idrow .badge{flex:none}
.drawer-summary{
  margin:10px 0 0; font-size:15px; font-weight:500; line-height:1.45; color:var(--ink);
  overflow-wrap:anywhere; /* full record: the summary wraps, the table truncates */
}
.drawer-body{flex:1; min-height:0; overflow-y:auto; padding:2px 28px 20px}
.drawer-sec{padding-top:18px}
.drawer-sec + .drawer-sec{margin-top:16px; border-top:1px solid var(--line-soft)}
/* section label: the card-label treatment, chips right when present */
.drawer-label{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 0 10px;
  font:600 11px/1 Inter,system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--mut);
}
.drawer-label .rel-chips{display:flex; letter-spacing:0; text-transform:none}
.kv{display:grid; grid-template-columns:124px 1fr; column-gap:12px; row-gap:7px; margin:0}
.kv dt{color:var(--mut); font-size:12.5px; padding-top:1px}
.kv dd{margin:0; color:var(--body); font-size:13px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; min-width:0}
.kv dd.empty{color:var(--faint)}

/* relations: search-row language — quiet rows that answer hover */
.rel-row{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:6px 8px; border-radius:8px; font-size:13px;
  transition:background-color .16s ease;
}
.rel-row:hover{background:var(--wash)}
.rel-row .r-id{flex:none; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.rel-row .r-sum{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--sec)}
.rel-empty{margin:2px 0 0; font-size:12.5px; color:var(--faint)}
.type-badge.sm{width:18px; height:18px; margin-right:0; font-size:8px}

.drawer-foot{flex:none; padding:14px 28px; border-top:1px solid var(--line-soft)}
.drawer-foot .ptc{
  display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:var(--r-pill);
  background:var(--accent-soft); color:var(--accent); font-size:12.5px; font-weight:600;
  transition:background-color .2s;
}
.drawer-foot .ptc:hover{background:#dbeafe}
.drawer-foot .ptc svg{width:13px; height:13px}

@media (prefers-reduced-motion: reduce){
  .drawer, .drawer-scrim, .drawer-handle::before, .rel-row{transition:none}
}

@media (max-width:1100px){
  .span4,.span3,.span5,.span7{grid-column:span 12}
}

/* ---------- print ----------
   Paper gets the content, not the chrome: the floating rail and any open
   overlays drop out, the table runs its full length, cards never split, and
   the status colors that carry meaning survive "background graphics: off". */
@media print{
  @page{ margin:12mm; }
  body{ background:#fff; }
  .rail, .search-panel, .drawer, .drawer-scrim, .col-pop{ display:none !important; }
  .main{ padding:0; }
  .content{ max-width:none; }
  .card{ box-shadow:none; }
  .bento .card{ break-inside:avoid; }
  #t-tbody tr{ break-inside:avoid; }
  .badge, .seg, .seg button.is-on, .bento-scope .scope-dot, .bento-scope button,
  .tl-dot, .pa-fill, .donut{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
}
/* ============================== Graph view ==============================
   Fixed full-area canvas behind floating capsule chrome (a rhyme of the
   rail). Nodes are 240px cards on a pannable/zoomable surface; edges are
   SVG hairlines — solid for tree links, dashed for shared-entity cross
   edges. Shown only while body[data-view="graph"]; locked decisions in
   dashboard-content.md §6 (#34-38). */
#graph-view{display:none}
body[data-view="graph"]{overflow:hidden}
body[data-view="graph"] .content > :not(#graph-view){display:none}
body[data-view="graph"] #graph-view{display:block}
.graph-view{position:fixed; inset:0 0 0 108px; z-index:1}
.g-viewport{position:absolute; inset:0; overflow:clip; cursor:grab; touch-action:none}
.g-viewport.dragging{cursor:grabbing}
.g-canvas{position:absolute; top:0; left:0; transform-origin:0 0}
.g-links{position:absolute; top:0; left:0; pointer-events:none}
.g-link{fill:none; stroke:#c9d3e4; stroke-width:1.25; transition:opacity .2s ease}
.g-link.x{stroke-dasharray:5 4; stroke:#bfc9dc}
.g-link.link-enter,.g-link.link-leave{opacity:0}

/* node card (240px; anatomy rhymes with the table row: type monogram, ID,
   state badge, one-line summary) */
.gn{position:absolute; top:0; left:0; width:240px;
    transition:transform .3s cubic-bezier(.22,.61,.36,1), translate .25s cubic-bezier(.22,.61,.36,1), opacity .2s ease}
.gn-enter,.gn-leave{opacity:0; translate:-12px 0}
.gn-leave{pointer-events:none}
.gn-body{display:block; width:100%; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:12px; padding:8px 11px 9px;
  transition:border-color .15s, box-shadow .15s}
.gn-body:hover{border-color:#c9d4e8; box-shadow:0 3px 10px rgba(2,5,32,.07)}
.gn-body:focus-visible{outline:2px solid var(--focus); outline-offset:1px}
.gn.hit .gn-body{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.gn.selected .gn-body{border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 6px 16px -6px rgba(59,130,246,.4)}
/* relation navigation flashes the target card (same fade as table rows) */
.gn.flash .gn-body{animation:flashfade 1.2s ease-out}
.gn-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.gn-kind{display:inline-flex; align-items:center; gap:5px; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font:600 10px/1.2 Inter,system-ui,sans-serif; letter-spacing:.07em;
  text-transform:uppercase; color:var(--gn-accent,#9aa1b2)}
.gn-kind .kdot{width:7px; height:7px; border-radius:50%; background:var(--gn-accent,#9aa1b2); flex:none}
/* mini progress ring (#40): own display effort over the claiming ECR's
   rollup total; ECR roots read a full ring, entities without effort data
   keep the corner blank (missing-values-stay-blank convention) */
.gn-ring{position:relative; width:24px; height:24px; flex:none}
.gn-ring[hidden]{display:none}
.gn-ring svg{display:block; width:100%; height:100%; transform:rotate(-90deg)}
.gn-ring circle{fill:none; stroke-width:2.5}
.gn-ring .tr{stroke:var(--line)}
.gn-ring .vl{stroke:var(--accent); stroke-linecap:round; transition:stroke-dasharray .25s ease}
.gn-ring b{position:absolute; inset:0; display:grid; place-items:center;
  font:600 8px/1 Inter,system-ui,sans-serif; color:var(--sec); font-variant-numeric:tabular-nums}
.gn-idrow{display:flex; align-items:center; gap:7px; margin-top:5px; min-width:0}
.gn .type-badge{width:20px; height:20px; margin-right:0; font-size:8.5px}
.gn-id{font-size:13px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.3}
.gn .badge{font-size:10px; padding:2px 8px; gap:4px; flex:none}
.gn .badge::before{width:4px; height:4px}
.gn-share{margin-left:auto; flex:none; font-size:9.5px; font-weight:600; color:var(--mut);
  background:var(--fog); border-radius:var(--r-pill); padding:2px 7px; font-variant-numeric:tabular-nums}
.gn-sum{display:block; margin-top:3px; font-size:11px; color:var(--mut);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* right-edge expand toggle pressed onto the connector: carries the
   direct-child count, hover swaps it for +, expanded shows − */
.gn-toggle{position:absolute; top:50%; right:-12px; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%; background:var(--card);
  border:1px solid var(--line); box-shadow:0 1px 2px rgba(2,5,32,.06);
  display:grid; place-items:center; color:var(--mut); z-index:2;
  transition:color .15s, border-color .15s}
.gn-toggle:hover{color:var(--gn-accent,var(--ink)); border-color:var(--gn-accent,var(--line))}
.gn-toggle:focus-visible{outline:2px solid var(--focus); outline-offset:1px}
.gn-toggle svg{width:12px; height:12px; display:none}
.gn-toggle .tt-num{font-size:10px; font-weight:600; font-variant-numeric:tabular-nums}
.gn:not(.expanded) .gn-toggle:hover .tt-num{display:none}
.gn:not(.expanded) .gn-toggle:hover .tt-plus{display:block}
.gn.expanded .tt-num{display:none}
.gn.expanded .tt-minus{display:block}

/* floating chrome capsules */
.g-chrome{position:absolute; z-index:5; display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  box-shadow:0 10px 28px -14px rgba(2,5,32,.2); padding:6px}
.g-toolbar{top:18px; left:50%; transform:translateX(-50%); max-width:calc(100% - 40px)}
.g-search{display:flex; align-items:center; gap:6px; color:var(--faint); padding:0 4px}
.g-search svg{width:15px; height:15px; flex:none}
.g-search input{border:0; outline:0; background:transparent; width:150px;
  font:400 12.5px Inter,system-ui,sans-serif; color:var(--ink); transition:width .2s ease}
.g-search input:focus{width:210px}
.g-search input::placeholder{color:var(--faint)}
.g-sep{width:1px; height:18px; background:var(--line-soft); flex:none}
.g-btn{font-size:12px; font-weight:500; color:var(--sec); padding:5px 11px; border-radius:var(--r-pill); white-space:nowrap}
.g-btn:hover{color:var(--ink)}
.g-caption{bottom:18px; left:20px; padding:7px 14px; font-size:11.5px; color:var(--mut); font-variant-numeric:tabular-nums}
.g-zoom{bottom:18px; right:20px; padding:4px; gap:2px}
.g-zoom button{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:var(--sec)}
.g-zoom button:hover{background:var(--fog); color:var(--ink)}
.g-zoom button svg{width:13px; height:13px}
#g-zoom-reset{width:auto; min-width:46px; font-size:11.5px; font-weight:600; color:var(--mut); font-variant-numeric:tabular-nums}
.g-empty{position:absolute; inset:0; display:grid; place-items:center;
  font-size:12.5px; color:var(--faint); pointer-events:none}
.g-empty[hidden]{display:none}
@media (prefers-reduced-motion:reduce){
  .gn,.g-link{transition:none}
  .gn.flash .gn-body{animation:none; background:#dbeafe}
  .gn-ring .vl{transition:none}
  .g-search input{transition:none}
}
@media print{ .graph-view{display:none !important} }
</style>
</head>
<body>
<div class="app">
  <!-- icon pill rail (left, centered): expanding search in the first slot,
       then the view items; the search pill overflows the capsule rightward -->
  <nav class="rail" aria-label="Views">
    <span class="rail-ind" aria-hidden="true"></span>
    <div class="exs" data-origin="left">
      <label class="exs-ico" for="global-search" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </label>
      <input id="global-search" class="exs-input" type="search" placeholder="Search ECRs, work items, actions…" aria-label="Global search"
             role="combobox" aria-expanded="false" aria-controls="search-panel" aria-autocomplete="list">
      <button class="exs-clear" id="exs-clear" type="button" aria-label="Clear search">✕</button>
      <span class="tip">Search</span>
    </div>
    <a class="rail-item is-active" href="#" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
      <span class="tip">Home</span>
    </a>
    <a class="rail-item" href="#" data-view="graph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 7.5 10.8 16M16.5 7.5 13.2 16M8.5 6h7"/></svg>
      <span class="tip">Graph</span>
    </a>
    <button class="rail-item" type="button" id="rail-print" aria-label="Print">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1.5"/></svg>
      <span class="tip">Print</span>
    </button>
  </nav>

  <main class="main">
    <div class="content">
      <div class="bento-scope" id="bento-scope" hidden aria-live="polite">
        <span class="scope-dot"></span>
        <span id="scope-text"></span>
        <button id="scope-clear" type="button">Clear filters</button>
      </div>

      <section class="bento" aria-label="Overview">
        <article class="card span4" id="card-totals">
          <div class="card-label">Totals</div>
          <div class="kpi-row" id="kpi-row"></div>
        </article>

        <article class="card span3" id="card-effort">
          <div class="card-label">Effort</div>
          <div class="kpi-row" id="effort-kpis"></div>
        </article>

        <article class="card span5" id="card-timeline">
          <ol class="tl" id="timeline"></ol>
        </article>

        <article class="card span7" id="card-process">
          <div class="card-label">Effort by Process Area</div>
          <div class="pa-list" id="pa-list"></div>
        </article>

        <article class="card span5" id="card-team">
          <div class="card-label">Effort by Team</div>
          <div class="team-wrap">
            <div class="donut" id="donut"><b id="donut-total"></b></div>
            <ul class="legend" id="team-legend"></ul>
          </div>
          <div class="card-foot">Sum of work-item planned effort</div>
        </article>
      </section>

      <section class="card table-card" aria-label="ECR table">
        <div class="t-head">
          <div class="t-title">ECRs<span class="t-num" id="t-visible"></span></div>
          <div class="t-controls">
            <div class="seg" role="group" aria-label="Status filter" id="seg">
              <button class="is-on" data-s="all">All</button>
              <button data-s="open">Open</button>
              <button data-s="closed">Closed</button>
            </div>
            <label class="t-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="t-filter" type="search" placeholder="Filter by ID, summary, or item content…" aria-label="Filter ECR rows">
            </label>
            <button class="t-clear" id="t-clear" type="button" hidden>Clear filters</button>
            <button class="t-cols-btn" id="t-export" type="button" title="Export the current table to Excel (.xlsx)">
              Export
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
            </button>
            <div class="t-cols">
              <button class="t-cols-btn" id="t-cols-btn" aria-haspopup="true" aria-expanded="false">
                Columns
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="t-cols-pop" id="t-cols-pop" role="menu"></div>
            </div>
          </div>
        </div>
        <div class="t-scroll">
          <table class="t-tbl" id="t-tbl">
            <thead><tr id="t-thead"></tr></thead>
            <tbody id="t-tbody"></tbody>
          </table>
        </div>
        <!-- singleton per-column filter dropdown, re-anchored on open -->
        <div class="col-pop" id="col-pop" role="dialog" aria-label="Column filter" hidden></div>
        <div class="t-foot">
          <span id="t-foot-count"></span>
          <span class="right">
            <span>Planned <b id="t-sum-p"></b></span>
            <span>Actual <b id="t-sum-a"></b></span>
          </span>
        </div>
      </section>

      <!-- Graph view: fixed full-area canvas with floating chrome; the rail's
           Graph item toggles body[data-view="graph"], which reveals this and
           hides the Home siblings -->
      <section class="graph-view" id="graph-view" aria-label="ECR relationship graph">
        <div class="g-viewport" id="g-viewport">
          <div class="g-canvas" id="g-canvas">

/* ---------- scoped aggregation helpers ----------
   The five bento cards recompute from the current search/status result set
   (one-way linkage: filters -> cards; cards stay non-clickable). Shared
   entities referenced by several ECRs are deduped per entity, mirroring the
   full-snapshot aggregates in DATA.agg when the scope is empty. */
function collectScoped(ecrs) {
  const wis = new Map(), actions = new Map();
  const walk = (n) => {
    if (wis.has(n.id)) return;
    wis.set(n.id, n);
    (n.children || []).forEach(walk);
  };
  ecrs.forEach((e) => {
    e.children.forEach(walk);
    e.actions.forEach((a) => actions.set(a.id, a));
  });
  return { wis, actions };
}

/* ---------- team donut card ---------- */
function renderTeam(ecrs) {
  const groups = {};
  collectScoped(ecrs).wis.forEach((n) => {

    const k = n.team || "Other";
    groups[k] = (groups[k] || 0) + n.planned;
  });
  const ranked = Object.entries(groups)
    .map(([name, value]) => ({ name, value: Math.round(value) }))
    .sort((a, b) => b.value - a.value);
  const top = ranked.slice(0, 5);
  if (ranked.length > 5) { // fold teams beyond the top 5 into "Other"
    const rest = ranked.slice(5).reduce((s, r) => s + r.value, 0);
    const other = top.find((r) => r.name === "Other");
    if (other) other.value += rest; else top.push({ name: "Other", value: rest });
  }
  const RAMP = ["#3b82f6", "#6ea3f8", "#9ec2fa", "#cedffc", "#e5effd"];
  const total = top.reduce((s, r) => s + r.value, 0);
  const donut = $("donut");
  if (total) {
    let from = 0;
    donut.style.background = "conic-gradient(" + top.map((r, i) => {
      const to = from + 100 * r.value / total;
      const color = r.name === "Other" ? "#cbd5e1" : RAMP[Math.min(i, RAMP.length - 1)];
      const seg = `${color} ${from.toFixed(2)}% ${to.toFixed(2)}%`;
      from = to;
      return seg;
    }).join(",") + ")";
  } else {
    donut.style.background = "#eef1f8"; // neutral ring when nothing is in scope
  }
  $("donut-total").textContent = fmt(total);
  $("team-legend").innerHTML = top.map((r, i) => `
    <li>
      <span class="ldot" style="background:${r.name === "Other" ? "#cbd5e1" : RAMP[Math.min(i, RAMP.length - 1)]}"></span>

      <span class="lval">${fmt(r.value)} (${total ? Math.round(100 * r.value / total) : 0}%)</span>
    </li>`).join("");
}

  const needle = q.toLowerCase();
  const hit = (n) => String(n.id).includes(needle) || n.summary.toLowerCase().includes(needle);
  const out = new Set();
  const walk = (nodes, chain) => {
    for (const n of nodes) {
      if (hit(n)) chain.forEach((id) => out.add(id));
      walk(n.children || [], [...chain, n.id]);
    }
  };
  for (const e of ecrs) {
    walk(e.children, [e.id]);
    e.actions.forEach((a) => { if (hit(a)) out.add(e.id); });
  }
  return out;
}

/* expansion in effect: manual toggles persist across re-renders; while a text
   filter is active the hit ancestor chains auto-expand as an overlay, and
   clearing the filter reverts to the manual state */
function effExpandedSet(ecrRows) {
  const set = new Set(state.expanded);
  if (state.q) hitAncestors(ecrRows, state.q).forEach((id) => set.add(id));
  state.suppressed.forEach((id) => set.delete(id));
  return set;
}

let effExpanded = new Set(); // expansion set actually rendered, for click handling

/* ---------- column filters (Excel-style per-column dropdowns) ----------
   Filter values are the DISPLAY strings of each cell (missing renders as ""
   and is offered as "(Blanks)", pinned last). Within one column the checked
   values form an OR; across columns they AND. Tree semantics: a row survives
   when its own value is selected OR any descendant survives; kept ancestors
   auto-expand so matches stay reachable. Candidate value lists are faceted —
   they only count rows passing every OTHER active filter. Scope is the table
   only: the bento cards stay driven by seg + text filter (Handoff §3.1). */
const colVal = {
  id: (r) => String(r.id),
  type: (r) => {
    const m = TYPE_META[r.type];
    return m ? m.name : (r.type || "").replace(/^ALM_/, "");
  },
  summary: (r) => r.summary,
  created: (r) => r.created || "",
  children: (r) => (r.childCount == null ? "" : String(r.childCount)),
  planned: (r) => fmt(r.effort),
  rollupPlanned: (r) => fmt(r.rollupPlanned),
  actual: (r) => fmt(r.actual),
  state: (r) => (r.state || "").replace(/^ALM_/, ""),
  processArea: (r) => r.processArea || "",
  project: (r) => r.project || "",
  closed: (r) => r.closed || "",
  owners: (r) => r.owners || "",
  team: (r) => r.team || "",
  plannedCompletion: (r) => r.plannedCompletion || "",
  analysisTarget: (r) => r.analysisTarget || "",
  classification: (r) => r.classification || "",
  overdue: (r) => (r.overdue ? "Overdue" : ""),
};
const colFiltersActive = () => state.filters.size > 0;

/* own-value pass; skipKey lets the dropdown list values facet-style */
function passesFilters(r, skipKey) {
  for (const [key, sel] of state.filters) {
    if (key === skipKey) continue;
    if (!sel.has(colVal[key](r))) return false;
  }
  return true;
}

/* every distinct row (deduped — shared entities appear under several ECRs)
   of the seg/text-filtered ECR set, expanded regardless of UI expansion */
function scopedRows() {
  const out = [], seen = new Set();
  const walk = (n) => {
    if (seen.has(n.id)) return;
    seen.add(n.id);
    out.push(n);
    n.kids.forEach(walk);
  };
  filteredRows().forEach((e) => walk(normEcr(e, 0)));
  return out;
}

/* which rows survive the column filters: { keep, expand } where keep holds
   ids to render (own match or kept descendant) and expand holds kept rows
   that must reveal a kept descendant. keep === null when nothing is filtered. */
function colFilterSets(ecrRows) {
  if (!colFiltersActive()) return { keep: null, expand: new Set() };
  const keep = new Set(), expand = new Set();
  const walk = (n) => {
    let kid = false;
    for (const k of n.kids) kid = walk(k) || kid;
    if (passesFilters(n) || kid) {
      keep.add(n.id);
      if (kid) expand.add(n.id);
      return true;
    }
    return false;
  };
  ecrRows.forEach((e) => walk(normEcr(e, 0)));
  return { keep, expand };
}

function syncFunnelIcons() {
  $("t-thead").querySelectorAll(".col-fbtn").forEach((b) => {
    b.classList.toggle("is-active", state.filters.has(b.dataset.fkey));
  });
}

function flattenRows(ecrRows, expandSet, keep) {
  const cmp = makeCmp(state.sortDir === "ascending" ? 1 : -1);
  const rows = [];
  const vis = (kids) => (keep ? kids.filter((k) => keep.has(k.id)) : kids);
  // tag each kid with its sorted-position lastness (drives guide-line
  // termination): a level's line ends at its LAST VISIBLE child's elbow
  const walkKids = (parent) => {
    const kids = vis([...parent.kids].sort(cmp));
    kids.forEach((k, i) => {
      k.isLast = i === kids.length - 1;
      k.lastChain = [...parent.lastChain, k.isLast];
    });
    for (const k of kids) {
      rows.push(k);
      if (expandSet.has(k.id)) walkKids(k);
    }
  };
  for (const e of [...ecrRows].map((x) => normEcr(x, 0)).sort(cmp)) {
    if (keep && !keep.has(e.id)) continue;
    e.lastChain = [];
    rows.push(e);
    if (expandSet.has(e.id)) walkKids(e);
  }
  return rows;
}

/* table row renderer (the search panel's result rowHTML lives further below) */
const GUIDE_PITCH = 23; // 11px gap + 1px line + 11px gap, per the tree reference

function trHTML(r, isOpen, isHit) {
  const cells = COLS.map((c) => {
    const cls = c.cls ? ` class="${c.cls}"` : "";
    // hierarchy guides live in the ID column only
    const guides = c.key === "id" && r.depth ? idGuides(r) : "";
    return `<td${cls} data-col="${c.key}">${guides}${cell[c.key](r)}</td>`;
  }).join("");
  const cls = `row ${r.kind}${r.expandable ? " expandable" : ""}${isOpen ? " is-open" : ""}${isHit ? " hit" : ""}`;
  const aria = r.expandable ? ` aria-expanded="${isOpen}"` : "";
  return `<tr class="${cls}" data-id="${r.id}"${aria}>${cells}</tr>`;
}

/* guide lines per Reference/Table_structure_UI_CSS.txt with classic tree
   termination: a level's vertical line stops at its LAST child's elbow
   (rounded corner) instead of running to the row bottom, and deeper rows of
   that subtree carry no line for that level anymore. lastChain[l-1] records
   whether the row's ancestor at level l is the last child of its group. */
function idGuides(r) {
  const d = r.depth;
  if (!d) return "";
  let out = `<span class="t-guides" aria-hidden="true">`;
  for (let l = 1; l < d; l++) {
    if (!r.lastChain[l - 1]) out += `<i class="vline" style="left:${11 + GUIDE_PITCH * (l - 1)}px"></i>`;
  }
  const x = 11 + GUIDE_PITCH * (d - 1);
  out += r.lastChain[d - 1]
    ? `<i class="elbow end" style="left:${x}px"></i>`
    : `<i class="vline" style="left:${x}px"></i><i class="elbow" style="left:${x}px"></i>`;
  return out + `</span>`;
}

const FUNNEL_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M22 3 2 3l8 9.46V19l4 2v-8.54L22 3z"/></svg>`;

function renderHead() {
  $("t-thead").innerHTML = COLS.map((c) => {
    const cls = [c.sort && "sortable", c.cls].filter(Boolean).join(" ");
    const attrs = `${cls ? ` class="${cls}"` : ""}${c.sort ? ` data-key="${c.key}" role="columnheader"` : ""}${state.sortKey === c.key ? ` aria-sort="${state.sortDir}"` : ""} data-col="${c.key}"`;
    // every data column carries a filter trigger; the chevron affordance column does not
    const fbtn = colVal[c.key]
      ? `<button type="button" class="col-fbtn${state.filters.has(c.key) ? " is-active" : ""}" data-fkey="${c.key}" aria-haspopup="true" aria-expanded="false" title="Filter ${escHTML(c.label || "column")}">${FUNNEL_SVG}</button>`
      : "";
    return `<th${attrs}>${c.label}${fbtn}</th>`;
  }).join("");
  $("t-thead").querySelectorAll("th.sortable").forEach((th) => {
    th.addEventListener("click", () => {
      const k = th.dataset.key;
      state.sortDir = state.sortKey === k && state.sortDir === "descending" ? "ascending" : "descending";
      state.sortKey = k;
      renderHead(); renderBody(filteredRows()); // sorting reshapes the table only
    });
  });
  $("t-thead").querySelectorAll(".col-fbtn").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation(); // a trigger click must not sort the column
      toggleColPop(btn.dataset.fkey, btn);
    });
  });
}

/* t-filter scope: ECR id/summary hit, or any nested WI/Action id/summary hit */
function ecrContentMatch(e, q) {
  const hit = (n) => n.id.toString().includes(q) || n.summary.toLowerCase().includes(q);
  const treeHit = (n) => hit(n) || (n.children || []).some(treeHit);
  return e.id.toString().includes(q) || e.summary.toLowerCase().includes(q) ||
    e.children.some(treeHit) || e.actions.some(hit);
}

function filteredRows() {
  const q = state.q.toLowerCase();
  return DATA.ecrs.filter((e) =>
    (state.seg === "all" || (state.seg === "open" ? e.open : !e.open)) &&
    (!q || ecrContentMatch(e, q)));
}

function renderBody(ecrRows) {
  if (!state.q && state.suppressed.size) state.suppressed.clear();
  const needle = state.q.toLowerCase();
  const hit = (r) => needle && (String(r.id).includes(needle) || r.summary.toLowerCase().includes(needle));

  // column filters prune the tree and force kept ancestor chains open
  const { keep, expand: colExpand } = colFilterSets(ecrRows);
  const expansion = effExpandedSet(ecrRows);
  colExpand.forEach((id) => expansion.add(id));
  effExpanded = expansion;

  const rows = flattenRows(ecrRows, expansion, keep);
  $("t-tbody").innerHTML = rows.length
    ? rows.map((r) => trHTML(r, r.expandable && expansion.has(r.id), hit(r))).join("")
    : `<tr class="t-empty"><td colspan="${COLS.length}">${
        colFiltersActive() ? "No rows match the active column filters" : "No ECRs match the current filter"}</td></tr>`;

  // footer counts reflect what column filters leave visible (ECR rows only,
  // inline child rows must not double count)
  const visEcrs = rows.filter((r) => r.kind === "ecr");
  $("t-visible").textContent = visEcrs.length;
  $("t-foot-count").textContent = `${visEcrs.length} of ${DATA.ecrs.length} ECRs`;
  $("t-sum-p").textContent = fmt(visEcrs.reduce((s, e) => s + (e.effort || 0), 0));
  $("t-sum-a").textContent = fmt(visEcrs.reduce((s, e) => s + (e.actual || 0), 0));
  applyCols();
  syncClearBtn();
}

/* row click toggles expansion (expandable rows only); drawer access moves to
   a dedicated detail button later, so leaf rows are inert for now */
$("t-tbody").addEventListener("click", (ev) => {
  // the detail button opens the drawer and must not toggle row expansion
  const dbtn = ev.target.closest(".row-detail");
  if (dbtn) { openDrawer(Number(dbtn.dataset.id), dbtn); return; }
  const tr = ev.target.closest("tr.row");
  if (!tr || !tr.classList.contains("expandable")) return;
  const id = Number(tr.dataset.id);
  if (state.q) {
    // visible state = manual ∪ filter overlay; collapsing only suppresses the
    // overlay for this filter session, clearing the filter reverts it
    if (effExpanded.has(id)) state.suppressed.add(id);
    else { state.expanded.add(id); state.suppressed.delete(id); }
  } else {
    state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
  }
  renderBody(filteredRows());
});

function applyCols() {
  // the last visible data column carries the right edge rail
  const visKeys = COLS.filter((c) => c.key !== "chev" && c.key !== "detail" && !state.hidden.has(c.key)).map((c) => c.key);
  const lastKey = visKeys[visKeys.length - 1];
  document.querySelectorAll("#t-tbl [data-col]").forEach((el) => {
    el.style.display = state.hidden.has(el.dataset.col) ? "none" : "";
    el.classList.toggle("edge", el.dataset.col === lastKey);
  });
}

/* columns dropdown: every data column is toggleable; unchecked = hidden */
(function initCols() {
  const pop = $("t-cols-pop");
  pop.innerHTML = COLS.filter((c) => c.key !== "chev" && c.key !== "detail").map((c) => `
    <label><input type="checkbox" data-col="${c.key}" ${state.hidden.has(c.key) ? "" : "checked"}> ${c.label}</label>`).join("");
  pop.querySelectorAll("input").forEach((cb) => {
    cb.addEventListener("change", () => {
      cb.checked ? state.hidden.delete(cb.dataset.col) : state.hidden.add(cb.dataset.col);
      applyCols();
    });
  });
  const btn = $("t-cols-btn");
  pop.addEventListener("click", (ev) => ev.stopPropagation());
  btn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    const open = pop.classList.toggle("is-open");
    btn.setAttribute("aria-expanded", open);
  });
  document.addEventListener("click", () => pop.classList.remove("is-open"));
})();

/* ---------- column filter dropdown (Excel-style) ---------- */
const colPop = $("col-pop");
let colPopKey = null;  // column whose dropdown is open
let colPopBtn = null;  // anchor trigger, for re-anchoring on scroll/resize
let colPopVals = [];   // candidate values behind the checkbox list (index -> value)

function toggleColPop(key, btn) {
  colPopKey === key ? closeColPop() : openColPop(key, btn);
}

function openColPop(key, btn) {
  colPopKey = key;
  colPopBtn = btn;
  const col = COLS.find((c) => c.key === key);
  const counts = new Map();
  scopedRows().filter((r) => passesFilters(r, key)).forEach((r) => {
    const v = colVal[key](r);
    counts.set(v, (counts.get(v) || 0) + 1);
  });
  // ascending, numeric-aware when every value is numeric; (Blanks) pinned last
  const vals = [...counts.keys()].filter((v) => v !== "");
  const numeric = vals.length > 0 && vals.every((v) => /^[\d,.]+$/.test(v));
  vals.sort(numeric
    ? (a, b) => parseFloat(a.replace(/,/g, "")) - parseFloat(b.replace(/,/g, ""))
    : (a, b) => a.localeCompare(b));
  if (counts.has("")) vals.push("");
  colPopVals = vals;

  const sel = state.filters.get(key);
  const checkedOf = (v) => (sel ? sel.has(v) : true);
  const item = (v, i) => {
    const disp = v === "" ? "(Blanks)" : v;
    return `<label class="col-pop-item" data-i="${i}" title="${escHTML(disp)}">
      <input type="checkbox"${checkedOf(v) ? " checked" : ""}>
      <span class="v${v === "" ? " blank" : ""}">${escHTML(disp)}</span>
      <span class="n">${counts.get(v)}</span>
    </label>`;
  };
  colPop.innerHTML = `
    <div class="col-pop-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="Search values" aria-label="Search values in ${escHTML(col.label || "column")}">
    </div>
    <label class="col-pop-item col-pop-all">
      <input type="checkbox" id="col-pop-all">
      <span class="v">(Select All)</span>
      <span class="n" id="col-pop-cnt"></span>
    </label>
    <div class="col-pop-list">${vals.map(item).join("") || `<div class="col-pop-none">No values</div>`}</div>
    <div class="col-pop-foot">
      <button type="button" id="col-pop-clear"${sel ? "" : " disabled"}>Clear filter</button>
    </div>`;

  const list = colPop.querySelector(".col-pop-list");
  const visibleItems = () => [...list.querySelectorAll(".col-pop-item[data-i]")]
    .filter((l) => l.style.display !== "none");
  const syncAll = () => {
    const boxes = visibleItems().map((l) => l.querySelector("input"));
    const on = boxes.filter((b) => b.checked).length;
    const all = $("col-pop-all");
    all.checked = boxes.length > 0 && on === boxes.length;
    all.indeterminate = on > 0 && on < boxes.length;
    $("col-pop-cnt").textContent = `${on}/${boxes.length}`;
  };
  // selection -> state -> re-render the table behind the open panel
  const applyColSel = () => {
    const checked = new Set();
    list.querySelectorAll(".col-pop-item[data-i]").forEach((lab) => {
      if (lab.querySelector("input").checked) checked.add(colPopVals[Number(lab.dataset.i)]);
    });
    const sel = state.filters.get(key);
    // values picked earlier but currently absent from the candidate list keep their state
    if (sel) [...sel].forEach((v) => { if (!colPopVals.includes(v)) checked.add(v); });
    if (checked.size === colPopVals.length) state.filters.delete(key); // everything selected = unfiltered
    else state.filters.set(key, checked);
    renderBody(filteredRows());
    syncFunnelIcons();
    $("col-pop-clear").disabled = !state.filters.has(key);
    syncAll();
  };

  list.addEventListener("change", (ev) => {
    if (ev.target.matches("input")) applyColSel();
  });
  $("col-pop-all").addEventListener("change", (ev) => {
    visibleItems().forEach((l) => { l.querySelector("input").checked = ev.target.checked; });
    applyColSel();
  });
  $("col-pop-clear").addEventListener("click", () => {
    state.filters.delete(key);
    list.querySelectorAll(".col-pop-item[data-i] input").forEach((b) => { b.checked = true; });
    renderBody(filteredRows());
    syncFunnelIcons();
    $("col-pop-clear").disabled = true;
    syncAll();
  });
  const sInput = colPop.querySelector(".col-pop-search input");
  sInput.addEventListener("input", () => {
    const q = sInput.value.trim().toLowerCase();
    list.querySelectorAll(".col-pop-item[data-i]").forEach((lab) => {
      const v = colPopVals[Number(lab.dataset.i)];
      const disp = (v === "" ? "(blanks)" : v).toLowerCase();
      lab.style.display = !q || disp.includes(q) ? "" : "none";
    });
    syncAll();
  });

  positionColPop(btn);
  syncAll();
  btn.setAttribute("aria-expanded", "true");
}

function positionColPop(btn) {
  const card = document.querySelector(".table-card").getBoundingClientRect();
  const br = btn.getBoundingClientRect();
  colPop.hidden = false; // commit content for measuring
  colPop.style.visibility = "hidden";
  colPop.style.left = "0px";
  colPop.style.top = "0px";
  // fit the panel in the viewport: shrink the value list first (96px floor),
  // then open toward whichever side has more room
  const list = colPop.querySelector(".col-pop-list");
  const below = window.innerHeight - br.bottom - 10;
  const above = br.top - 10;
  if (list) {
    const chrome = colPop.offsetHeight - list.offsetHeight; // search + select-all + footer + padding
    if (chrome + 264 > Math.max(below, above)) {
      list.style.maxHeight = Math.max(96, Math.min(264, Math.max(below, above) - chrome)) + "px";
    }
  }
  const w = colPop.offsetWidth, h = colPop.offsetHeight;
  let left = Math.max(4, br.left - card.left);
  if (left + w > card.width - 8) left = Math.max(4, br.right - card.left - w);
  const fitsBelow = br.bottom + 6 + h <= window.innerHeight;
  const fitsAbove = br.top - 6 - h >= 0;
  const topVp = fitsBelow || !fitsAbove ? br.bottom + 6 : br.top - 6 - h;
  colPop.style.left = left + "px";
  colPop.style.top = topVp - card.top + "px";
  colPop.style.visibility = "";
}

function closeColPop() {
  if (colPopKey == null) return;
  colPopKey = null;
  colPopBtn = null;
  colPop.hidden = true;
  $("t-thead").querySelectorAll(".col-fbtn").forEach((b) => b.setAttribute("aria-expanded", "false"));
}

/* scroll/resize keeps the panel anchored under its trigger; it only closes
   when the trigger leaves the viewport or the thead re-renders (sort) */
function reanchorColPop() {
  if (colPopKey == null) return;
  if (!colPopBtn || !colPopBtn.isConnected) { closeColPop(); return; }
  const r = colPopBtn.getBoundingClientRect();
  if (r.width === 0 || r.bottom < 0 || r.top > window.innerHeight) { closeColPop(); return; }
  positionColPop(colPopBtn);
}

/* outside click dismisses; trigger clicks stopPropagation before this fires */
document.addEventListener("click", (ev) => {
  if (!colPop.hidden && !ev.target.closest("#col-pop")) closeColPop();
});

/* inner scrolling of the value list must not re-anchor; anything else does */
document.addEventListener("scroll", (ev) => {
  if (colPopKey == null) return;
  if (ev.target instanceof Element && ev.target.closest("#col-pop")) return;
  reanchorColPop();
}, true);
window.addEventListener("resize", reanchorColPop);
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !colPop.hidden) closeColPop();
});

/* status segmented filter */
function setSeg(s) {
  state.seg = s;
  $("seg").querySelectorAll("button").forEach((x) => x.classList.toggle("is-on", x.dataset.s === s));
}
$("seg").querySelectorAll("button").forEach((b) => {
  b.addEventListener("click", () => { setSeg(b.dataset.s); refresh(); });
});
$("t-filter").addEventListener("input", (ev) => { state.q = ev.target.value.trim(); refresh(); });

/* clear-all button: one action resets seg + text + every column filter;
   visibility is synced from renderBody so every filter path updates it */
function anyTableFilterActive() {
  return state.seg !== "all" || state.q !== "" || colFiltersActive();
}
function syncClearBtn() {
  $("t-clear").hidden = !anyTableFilterActive();
}
function clearAllTableFilters() {
  state.filters.clear();
  syncFunnelIcons();
  setSeg("all");
  state.q = "";
  $("t-filter").value = "";
  refresh();
}
$("t-clear").addEventListener("click", clearAllTableFilters);

/* ---------- global search (⌘K) ----------
   Preview-only: typing never touches the table or the bento cards.
   Picking a result navigates — reset conflicting table filters first,
   then locate, expand and flash; the query itself stays in the box. */
const gsearch = $("global-search");
const gpanel = $("search-panel");
document.addEventListener("keydown", (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") {
    ev.preventDefault();
    gsearch.focus();
    gsearch.select();
  }
});

/* searchable index: every WI/Action entity once, mapped to its root ECR
   (+ parent links so picking a child can expand its full ancestor chain) */
const WI_INDEX = [], WI_ROOT = new Map(), WI_PARENT = new Map(),
      ACTION_INDEX = [], ACTION_ROOT = new Map();
(() => {
  const seen = new Set();
  const walk = (n, root, parent) => {
    if (!seen.has(n.id)) {
      seen.add(n.id);
      WI_INDEX.push({ id: n.id, summary: n.summary, open: n.open });
      WI_ROOT.set(n.id, root);
      WI_PARENT.set(n.id, parent);
    }
    (n.children || []).forEach((c) => walk(c, root, n.id));
  };
  DATA.ecrs.forEach((e) => {
    e.children.forEach((c) => walk(c, e.id, e.id));
    e.actions.forEach((a) => {
      if (!ACTION_ROOT.has(a.id)) {
        ACTION_INDEX.push({ id: a.id, summary: a.summary, open: a.open });
        ACTION_ROOT.set(a.id, e.id);
      }
    });
  });
})();

const escHTML = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* escape, then wrap needle matches in <mark> */
const hl = (text, needle) => {
  if (!needle) return escHTML(text);
  const safe = needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return String(text).split(new RegExp(`(${safe})`, "ig"))
    .map((part, i) => (i % 2 ? `<mark>${escHTML(part)}</mark>` : escHTML(part))).join("");
};

const Search = { q: "", results: [], totals: null, active: -1, open: false, timer: null };

function searchEntities(q) {
  const needle = q.toLowerCase();
  const digits = /^\d+$/.test(q) ? q : null;
  const group = (items, name, rootOf, byCreated) => {
    const hits = items.filter((it) =>
      String(it.id).toLowerCase().includes(needle) || it.summary.toLowerCase().includes(needle));
    hits.sort((a, b) => {
      if (digits) {
        const pa = String(a.id).startsWith(digits) ? 0 : 1;
        const pb = String(b.id).startsWith(digits) ? 0 : 1;
        if (pa !== pb) return pa - pb;
      }
      return byCreated ? (a.created < b.created ? 1 : -1) : Number(b.id) - Number(a.id);
    });
    return { name, hits, shown: hits.slice(0, 5).map((it) => ({ group: name, item: it, rootId: rootOf(it) })) };
  };
  const groups = [
    group(DATA.ecrs, "ecr", (it) => it.id, true),
    group(WI_INDEX, "wi", (it) => WI_ROOT.get(it.id), false),
    group(ACTION_INDEX, "action", (it) => ACTION_ROOT.get(it.id), false),
  ];
  return { flat: groups.flatMap((g) => g.shown), totals: new Map(groups.map((g) => [g.name, g.hits.length])) };
}

const GROUP_LABEL = { ecr: "ECRs", wi: "Work Items", action: "Actions" };

function rowHTML(r, i) {
  const meta = r.group === "ecr" ? r.item.created : `∈ ${r.rootId}`;
  return `<div class="search-row" role="option" id="search-opt-${i}" data-idx="${i}" aria-selected="false">
    <span class="dot ${r.item.open ? "open" : "closed"}"></span>
    <span class="s-id">${hl(r.item.id, Search.q)}</span>
    <span class="s-sum" title="${escHTML(r.item.summary)}">${hl(r.item.summary, Search.q)}</span>
    <span class="s-meta">${meta}</span>
  </div>`;
}

function syncActiveAria() {
  gsearch.setAttribute("aria-activedescendant", Search.active < 0 ? "" : `search-opt-${Search.active}`);
}

function syncActive(scroll) {
  gpanel.querySelectorAll(".search-row.active").forEach((el) => {
    el.classList.remove("active");
    el.setAttribute("aria-selected", "false");
  });
  if (Search.active < 0 || !Search.results.length) { syncActiveAria(); return; }
  const el = gpanel.querySelector(`[data-idx="${Search.active}"]`);
  if (!el) return;
  el.classList.add("active");
  el.setAttribute("aria-selected", "true");
  syncActiveAria();
  if (scroll) el.scrollIntoView({ block: "nearest" });
}

function renderPanel() {
  if (!Search.results.length) {
    gpanel.innerHTML = `<div class="search-empty">No results for &ldquo;${escHTML(Search.q)}&rdquo;</div>`;
    syncActiveAria();
    return;
  }
  let html = "", last = null;
  Search.results.forEach((r, i) => {
    if (r.group !== last) {
      last = r.group;
      html += `<div class="search-ghead"><span>${GROUP_LABEL[last]}</span><span class="cnt">${Search.totals.get(last)}</span></div>`;
    }
    html += rowHTML(r, i);
  });
  html += `<div class="search-foot"><span>↑↓ navigate</span><span>Enter open</span><span>Esc close</span></div>`;
  gpanel.innerHTML = html;
  syncActive(false);
}

function openPanel() {
  if (Search.timer) { clearTimeout(Search.timer); Search.timer = null; }
  gpanel.hidden = false;
  gpanel.getBoundingClientRect(); // commit pre-open styles so the transition runs
  gpanel.classList.add("open");
  Search.open = true;
  gsearch.setAttribute("aria-expanded", "true");
}

function closePanel() {
  gpanel.classList.remove("open");
  Search.timer = setTimeout(() => { gpanel.hidden = true; }, 160);
  Search.open = false;
  gsearch.setAttribute("aria-expanded", "false");
}

/* brief accent wash on the located row / expanded child item */
function flash(el) {
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.remove("flash");
  void el.offsetWidth; // restart the animation on repeat selections
  el.classList.add("flash");
  el.addEventListener("animationend", () => el.classList.remove("flash"), { once: true });
}

/* graph twin of flash(): the transformed canvas has no scroll container, so
   panning carries the card into view instead of scrollIntoView */
function flashGraphNode(key) {
  const el = Graph._nodeEls.get(key);
  if (!el) return; // target hidden by the current graph filter — nothing to flash
  Graph._revealCard(key);
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
  el.addEventListener("animationend", () => el.classList.remove("flash"), { once: true });
}

function selectResult(r) {
  closePanel();
  let changed = false;
  if (state.seg !== "all") { setSeg("all"); changed = true; }
  if (state.q !== "") { state.q = ""; $("t-filter").value = ""; changed = true; }
  if (changed) refresh(); // restore the full table before locating
  const rootId = r.group === "ecr" ? r.item.id : r.rootId;
  // expand the full ancestor chain, then flash the picked row (child rows are
  // inline now, so the target itself is always a table row)
  state.expanded.add(rootId);
  if (r.group === "wi") {
    let cur = WI_PARENT.get(r.item.id);
    while (cur != null && cur !== rootId) { state.expanded.add(cur); cur = WI_PARENT.get(cur); }
  }
  renderBody(filteredRows());
  let tr = document.querySelector(`#t-tbody tr.row[data-id="${r.item.id}"]`);
  if (!tr && colFiltersActive()) {
    // column filters can hide the target row too; selection wins, so drop them
    state.filters.clear();
    syncFunnelIcons();
    renderBody(filteredRows());
    tr = document.querySelector(`#t-tbody tr.row[data-id="${r.item.id}"]`);
  }
  if (tr) flash(tr);
  gsearch.blur();
}

gsearch.addEventListener("input", () => {
  Search.q = gsearch.value.trim();
  if (!Search.q) { closePanel(); return; }
  const res = searchEntities(Search.q);
  Search.results = res.flat;
  Search.totals = res.totals;
  Search.active = Search.results.length ? 0 : -1;
  renderPanel();
  openPanel();
});
gsearch.addEventListener("focus", () => {
  if (Search.q) { renderPanel(); openPanel(); }
});
gsearch.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    if (!Search.open || !Search.results.length) return;
    ev.preventDefault();
    const dir = ev.key === "ArrowDown" ? 1 : -1;
    Search.active = (Search.active + dir + Search.results.length) % Search.results.length;
    syncActive(true);
  } else if (ev.key === "Enter") {
    if (!Search.open || !Search.results.length) return;
    ev.preventDefault();
    selectResult(Search.results[Search.active]);
  } else if (ev.key === "Escape") {
    ev.preventDefault(); // first Esc keeps the query; native search-input clear is manual
    if (Search.open) { ev.stopPropagation(); closePanel(); }
    else if (gsearch.value) { gsearch.value = ""; Search.q = ""; }
  }
});
/* tabbing away must not leave an orphan flyout next to a collapsed rail
   (result rows are mousedown-prevented, so selecting never triggers this) */
gsearch.addEventListener("blur", () => { if (Search.open) closePanel(); });
/* pressing a result row must not move focus off the input */
gpanel.addEventListener("mousedown", (ev) => {
  if (ev.target.closest(".search-row")) ev.preventDefault();
});
gpanel.addEventListener("mouseover", (ev) => {
  const row = ev.target.closest(".search-row");
  if (!row) return;
  const idx = Number(row.dataset.idx);
  if (idx !== Search.active) { Search.active = idx; syncActive(false); }
});
gpanel.addEventListener("click", (ev) => {
  const row = ev.target.closest(".search-row");
  if (!row) return;
  selectResult(Search.results[Number(row.dataset.idx)]);
});
document.addEventListener("mousedown", (ev) => {
  // the panel is no longer inside the search pill, so it must count as "inside"
  if (Search.open && !ev.target.closest(".exs, #search-panel")) closePanel();
});

/* ✕ clears the query; the synthetic input event reuses the normal
   empty-query path (closes the panel), and focus stays in the pill */
$("exs-clear").addEventListener("mousedown", (ev) => ev.preventDefault());
$("exs-clear").addEventListener("click", () => {
  gsearch.value = "";
  gsearch.dispatchEvent(new Event("input"));
  gsearch.focus();
});

/* print: hand the whole page to the browser's print dialog; the @media print
   stylesheet strips the floating chrome and lets the table run full length */
$("rail-print").addEventListener("click", () => window.print());

/* one refresh re-scopes cards, scope cue and table from the same result set */
function refresh() {
  const rows = filteredRows();
  renderCards(rows);
  const scoped = state.q !== "" || state.seg !== "all";
  $("bento-scope").hidden = !scoped;
  if (scoped) {
    $("scope-text").innerHTML = `Cards reflect <b>${rows.length}</b> of ${DATA.ecrs.length} ECRs`;
  }
  renderBody(rows);
}
$("scope-clear").addEventListener("click", clearAllTableFilters);

/* ---------- detail drawer ----------
   Docked inspection sheet opened by the table's row-detail buttons. Renders
   the full record grouped Core / Dates / Effort / Relations (locked content
   spec §5, mockup field subset); relations navigate in place and keep the
   table behind in sync: expand the ancestor chain, re-render, flash. */
const DRAWER_DEFAULT_W = 440, DRAWER_MIN_W = 320, DRAWER_MAX_W = 960;
let drawerW = DRAWER_DEFAULT_W; // session-persistent width, survives open/close
let drawerSeq = 0;              // guards the hide-after-transition timer
const drawerState = { open: false, kind: null, id: null, trigger: null };
const drawerEl = $("drawer"), drawerScrim = $("drawer-scrim"),
      drawerBody = $("drawer-body"), drawerHandle = $("drawer-handle");

/* entity index: every ECR / WI / Action / Build once (shared entities are
   unique in the payload), with parent + root ids so relations can navigate.
   `parents` lists EVERY referencing parent from the graph edges (shared
   entities carry several — decision #39); `parent`/`root` keep the tree
   position the Home-table sync uses. Parents sort newest-first. */
const DRAWER_INDEX = new Map();
(() => {
  const parentsOf = new Map();
  for (const rel of ["work_items", "actions", "work_item_for"]) {
    for (const [p, c] of GRAPH.edges[rel] || []) {
      if (!parentsOf.has(c)) parentsOf.set(c, []);
      parentsOf.get(c).push(p);
    }
  }
  for (const list of parentsOf.values()) list.sort((a, b) => Number(b) - Number(a));
  const parentsOfId = (id, fallback) => {
    const list = parentsOf.get(id);
    return list && list.length ? list : (fallback != null ? [fallback] : []);
  };
  const addWi = (n, parent, root) => {
    if (!DRAWER_INDEX.has(n.id))
      DRAWER_INDEX.set(n.id, { kind: "wi", node: n, parent, root, parents: parentsOfId(n.id, parent) });
    (n.children || []).forEach((c) => addWi(c, n.id, root));
  };
  DATA.ecrs.forEach((e) => {
    DRAWER_INDEX.set(e.id, { kind: "ecr", node: e, parent: null, root: e.id, parents: [] });
    e.children.forEach((c) => addWi(c, e.id, e.id));
    e.actions.forEach((a) => {
      if (!DRAWER_INDEX.has(a.id))
        DRAWER_INDEX.set(a.id, { kind: "action", node: a, parent: e.id, root: e.id, parents: [e.id] });
    });
  });
  // builds live outside the DATA tree; parents come from the graph edges
  (DATA.builds || []).forEach((b) => {
    const parents = parentsOf.get(b.id) || [];
    DRAWER_INDEX.set(b.id, { kind: "build", node: b, parent: parents[0] ?? null,
                             root: parents[0] ?? null, parents });
  });
})();

/* "—" marks a present-but-empty field; fields that don't exist on a kind are
   omitted entirely (dt/dd pairs are built per kind) */
const kv = (label, v) => (v == null || v === ""
  ? `<dt>${label}</dt><dd class="empty">—</dd>`
  : `<dt>${label}</dt><dd>${escHTML(String(v))}</dd>`);
const typeOf = (n) => n.type || "ALM_Change Request"; // ecr nodes carry no type
const badgeOf = (n, small) => {
  const m = TYPE_META[typeOf(n)];
  return m ? `<span class="type-badge${small ? " sm" : ""} ${m.cls}" title="${m.name}">${m.tag}</span>` : "";
};

function drawerSections(entry) {
  const n = entry.node, kind = entry.kind;
  const sec = (label, rows) => `<section class="drawer-sec"><h3 class="drawer-label">${label}</h3><dl class="kv">${rows.join("")}</dl></section>`;
  const core = [
    kv("Type", TYPE_META[typeOf(n)] ? TYPE_META[typeOf(n)].name : typeOf(n)),
    kv("State", n.state),
  ];
  if (kind === "wi") core.push(kv("Process Area", n.processArea));
  if (kind === "build") core.push(kv("Maturity", n.maturity));
  if (n.classification != null) core.push(kv("Classification", n.classification));
  core.push(kv("Owners", n.owners), kv("Team", n.team), kv("Project", n.project));
  const dates = [
    kv("Created", n.created),
    kv("Closed Date", n.closed),
    kv("Planned Completion", n.plannedCompletion),
  ];
  if (kind === "ecr") dates.push(kv("Analysis Target", n.analysisTarget));
  // builds carry no effort fields in PTC — the section is omitted entirely
